apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: message-service
  template:
    metadata:
      labels:
        app: message-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: message-service
        image: message-service:v1.0.0
        imagePullPolicy: IfNotPresent

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8083
        resources:
          requests:
            cpu: "100m"
            memory: "384Mi"
          limits:
            cpu: "300m"
            memory: "768Mi"
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8083
          failureThreshold: 60
          periodSeconds: 10
          timeoutSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8083
          periodSeconds: 10
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8083
          periodSeconds: 10
          timeoutSeconds: 10
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: adapta-secrets
              key: jwt-secret
        - name: ENCRYPTION_SECRET
          valueFrom:
            secretKeyRef:
              name: adapta-secrets
              key: encryption-secret
        - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
          value: http://jaeger:4318/v1/traces
        - name: SPRING_DATA_MONGODB_URI
          value: mongodb://mongodb:27017/messagedb
        - name: SPRING_RABBITMQ_HOST
          value: rabbitmq
        - name: GRPC_CLIENT_USER_SERVICE_ADDRESS
          value: static://user-service:9090
        - name: GRPC_CLIENT_USER_SERVICE_NEGOTIATION_TYPE
          value: TLS
        - name: GRPC_CLIENT_USER_SERVICE_DEADLINE
          value: 5s
        - name: GRPC_CLIENT_USER_SERVICE_SECURITY_KEY_STORE
          value: file:/app/certs/message-service.jks
        - name: GRPC_CLIENT_USER_SERVICE_SECURITY_KEY_STORE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: adapta-secrets
              key: grpc-keystore-password
        - name: GRPC_CLIENT_USER_SERVICE_SECURITY_KEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: adapta-secrets
              key: grpc-keystore-password
        - name: GRPC_CLIENT_USER_SERVICE_SECURITY_TRUST_STORE
          value: file:/app/certs/truststore.jks
        - name: GRPC_CLIENT_USER_SERVICE_SECURITY_TRUST_STORE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: adapta-secrets
              key: grpc-truststore-password
        - name: SPRING_DATA_REDIS_HOST
          value: redis
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: certs-volume
          mountPath: /app/certs
          readOnly: true
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: certs-volume
        secret:
          secretName: message-service-certs
---
apiVersion: v1
kind: Service
metadata:
  name: message-service
spec:
  selector:
    app: message-service
  ports:
  - port: 8080
    targetPort: 8083
