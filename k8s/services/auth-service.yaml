apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
      - name: auth-service
        image: auth-service:v1.0.0
        imagePullPolicy: IfNotPresent

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8081
        resources:
          requests:
            cpu: "100m"
            memory: "384Mi"
          limits:
            cpu: "300m"
            memory: "768Mi"
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          failureThreshold: 60
          periodSeconds: 10
          timeoutSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          periodSeconds: 10
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          periodSeconds: 10
          timeoutSeconds: 10
          successThreshold: 1
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: adapta-secrets
              key: jwt-secret
        - name: ENCRYPTION_SECRET
          valueFrom:
            secretKeyRef:
              name: adapta-secrets
              key: encryption-secret
        - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
          value: http://jaeger:4318/v1/traces
        - name: GRPC_CLIENT_USER_SERVICE_ADDRESS
          value: static://user-service:9090
        - name: GRPC_CLIENT_USER_SERVICE_NEGOTIATION_TYPE
          value: TLS
        - name: GRPC_CLIENT_USER_SERVICE_DEADLINE
          value: 5s
        - name: GRPC_CLIENT_USER_SERVICE_SECURITY_KEY_STORE
          value: file:/app/certs/auth-service.jks
        # Both key store and key passwords share the same secret by default (see scripts/generate-certs.ps1)
        - name: GRPC_CLIENT_USER_SERVICE_SECURITY_KEY_STORE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: adapta-secrets
              key: grpc-keystore-password
        - name: GRPC_CLIENT_USER_SERVICE_SECURITY_KEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: adapta-secrets
              key: grpc-keystore-password
        - name: GRPC_CLIENT_USER_SERVICE_SECURITY_TRUST_STORE
          value: file:/app/certs/truststore.jks
        - name: GRPC_CLIENT_USER_SERVICE_SECURITY_TRUST_STORE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: adapta-secrets
              key: grpc-truststore-password
        - name: SPRING_DATA_REDIS_HOST
          value: redis
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: adapta-secrets
              key: redis-password
        - name: SPRING_DATA_REDIS_SSL_ENABLED
          value: "false"
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: certs-volume
          mountPath: /app/certs
          readOnly: true
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: certs-volume
        secret:
          secretName: auth-service-certs
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
  - port: 8080
    targetPort: 8081
