apiVersion: v1
kind: Secret
metadata:
  name: adapta-secrets
type: Opaque
# DEVELOPMENT & DEMO SECRETS
# NOTE: These values are for local Minikube development only.
# DO NOT use these in a production environment.
stringData:
  jwt-secret: "dev-jwt-signing-secret-at-least-32-characters-long-2026"
  encryption-secret: "dev-aes-encryption-secret-32-chars-long-!!-2026"
  openrouter-api-key: "sk-or-v1-dev-dummy-key-replace-to-enable-real-ai"
  mongodb-uri: "mongodb://mongodb:27017/adaptachat"
  redis-password: "dev-redis-password"
  ADMIN_SETUP_USERNAME: "admin"
  ADMIN_SETUP_PASSWORD: "admin-password-2026"
  grpc-keystore-password: "password"
  grpc-truststore-password: "password"
